<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Neo - The Ultimate Premium Ludo Experience</title>
    <meta name="description" content="Experience Ludo like never before with Ludo Neo. A modern, premium, and beautifully designed Ludo game for you and your friends.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="game-container">
            <aside class="player-info left">
                <div id="player-1" class="player-card red active">
                    <div class="avatar">R</div>
                    <div class="details">
                        <span class="name">Player 1</span>
                        <span class="status">Your Turn</span>
                    </div>
                </div>
                <div id="player-4" class="player-card blue">
                    <div class="avatar">B</div>
                    <div class="details">
                        <span class="name">Player 4</span>
                        <span class="status">Waiting...</span>
                    </div>
                </div>
            </aside>

            <main class="ludo-board-wrapper">
                <div id="ludo-board" class="ludo-board shadow-glow">
                    <!-- Board structure will be generated by JS for precision, 
                         but let's define the base zones here -->
                    <div class="house red-house" id="house-red">
                        <div class="inner-house">
                            <div class="token-slot" data-player="red" data-index="0"></div>
                            <div class="token-slot" data-player="red" data-index="1"></div>
                            <div class="token-slot" data-player="red" data-index="2"></div>
                            <div class="token-slot" data-player="red" data-index="3"></div>
                        </div>
                    </div>
                    <div class="house green-house" id="house-green">
                        <div class="inner-house">
                            <div class="token-slot" data-player="green" data-index="0"></div>
                            <div class="token-slot" data-player="green" data-index="1"></div>
                            <div class="token-slot" data-player="green" data-index="2"></div>
                            <div class="token-slot" data-player="green" data-index="3"></div>
                        </div>
                    </div>
                    <div class="house yellow-house" id="house-yellow">
                        <div class="inner-house">
                            <div class="token-slot" data-player="yellow" data-index="0"></div>
                            <div class="token-slot" data-player="yellow" data-index="1"></div>
                            <div class="token-slot" data-player="yellow" data-index="2"></div>
                            <div class="token-slot" data-player="yellow" data-index="3"></div>
                        </div>
                    </div>
                    <div class="house blue-house" id="house-blue">
                        <div class="inner-house">
                            <div class="token-slot" data-player="blue" data-index="0"></div>
                            <div class="token-slot" data-player="blue" data-index="1"></div>
                            <div class="token-slot" data-player="blue" data-index="2"></div>
                            <div class="token-slot" data-player="blue" data-index="3"></div>
                        </div>
                    </div>
                    
                    <div class="center-square">
                        <div class="triangle red-tri"></div>
                        <div class="triangle green-tri"></div>
                        <div class="triangle yellow-tri"></div>
                        <div class="triangle blue-tri"></div>
                        <div class="center-logo">NEO</div>
                    </div>

                    <!-- Path cells will be injected here -->
                    <div id="cells-container"></div>
                </div>

                <div class="controls">
                    <div id="dice-container" class="dice-wrapper">
                        <div id="dice" class="dice dice-1">
                            <div class="face-1 face front"><div class="dot"></div></div>
                            <div class="face-6 face back">
                                <div class="dot"></div><div class="dot"></div>
                                <div class="dot"></div><div class="dot"></div>
                                <div class="dot"></div><div class="dot"></div>
                            </div>
                            <div class="face-3 face right">
                                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                            </div>
                            <div class="face-4 face left">
                                <div class="dot"></div><div class="dot"></div>
                                <div class="dot"></div><div class="dot"></div>
                            </div>
                            <div class="face-5 face top">
                                <div class="dot"></div><div class="dot"></div>
                                <div class="dot"></div>
                                <div class="dot"></div><div class="dot"></div>
                            </div>
                            <div class="face-2 face bottom">
                                <div class="dot"></div><div class="dot"></div>
                            </div>
                        </div>
                    </div>
                    <button id="roll-btn" class="btn-primary">ROLL DICE</button>
                    <div id="game-status" class="game-status">Roll the dice to start!</div>
                </div>
            </main>

            <aside class="player-info right">
                <div id="player-2" class="player-card green">
                    <div class="avatar">G</div>
                    <div class="details">
                        <span class="name">Player 2</span>
                        <span class="status">Waiting...</span>
                    </div>
                </div>
                <div id="player-3" class="player-card yellow">
                    <div class="avatar">Y</div>
                    <div class="details">
                        <span class="name">Player 3</span>
                        <span class="status">Waiting...</span>
                    </div>
                </div>

                <div class="leaderboard glass-card small">
                    <h3>🏆 Leaderboard</h3>
                    <div id="leaderboard-list">
                        <div class="loading">Connect server to view...</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Celebration/Modals -->
    <div id="winner-modal" class="modal hidden">
        <div class="modal-content glass-card">
            <h2 id="winner-text">Red Wins!</h2>
            <p>Congratulations on a brilliant victory!</p>
            <button id="restart-btn" class="btn-secondary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
